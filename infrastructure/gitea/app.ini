APP_NAME = ForgeOps
RUN_MODE = prod
WORK_PATH = /data/gitea

[server]
PROTOCOL = http
HTTP_PORT = 3000
ROOT_URL = http://localhost/gitea/
DISABLE_SSH = false
SSH_PORT = 22
SSH_LISTEN_PORT = 22
OFFLINE_MODE = true

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[repository]
ROOT = /data/gitea/repositories
DEFAULT_BRANCH = main
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG = true

[repository.upload]
ENABLED = true
MAX_SIZE = 500
MAX_FILES = 50

[security]
INSTALL_LOCK = true
SECRET_KEY = s3cr3tk3y-forgeops-gitea
INTERNAL_TOKEN = internaltoken-forgeops
MIN_PASSWORD_LENGTH = 8
PASSWORD_COMPLEXITY = lower,upper,digit

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
ENABLE_CAPTCHA = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true

[mailer]
ENABLED = false

[indexer]
ISSUE_INDEXER_TYPE = bleve
REPO_INDEXER_ENABLED = true

[webhook]
ALLOWED_HOST_LIST = *
SKIP_TLS_VERIFY = true

[log]
MODE = console
LEVEL = info
ROOT_PATH = /data/gitea/log

[ui]
DEFAULT_THEME = gitea

[oauth2]
JWT_SECRET = WiMw53sy9s7WG4RPfd4hKVdLZyHQTVP1oE6BPk_15cA
