worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    # ── Upstream Backends ──────────────────────────────────
    upstream gitea_backend {
        server gitea:3000;
    }

    upstream jenkins_backend {
        server jenkins:8080;
    }

    upstream dashboard_api {
        server dashboard-backend:5050;
    }

    upstream dashboard_ui {
        server dashboard-frontend:80;
    }

    upstream registry_backend {
        server registry:5000;
    }

    # ── Main Server (HTTP & HTTPS) ──────────────────────────
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name localhost forgeops.local;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/forgeops.crt;
        ssl_certificate_key /etc/nginx/certs/forgeops.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https:;" always;

        # Dashboard (default root) with Basic Auth
        location / {
            auth_basic "ForgeOps Secure Dashboard";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://dashboard_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard API with Basic Auth
        location /api/ {
            auth_basic "ForgeOps Secure Dashboard";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://dashboard_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Gitea
        location /gitea/ {
            proxy_pass http://gitea_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Catch Gitea's internal redirects and force them to stay in /gitea/
            proxy_redirect http://gitea:3000/ /gitea/;
            proxy_redirect http://localhost/ /gitea/;
        }

        # Jenkins
        location /jenkins/ {
            proxy_pass http://jenkins_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support (Jenkins terminal)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # Docker Registry
        location /v2/ {
            proxy_pass http://registry_backend/v2/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            client_max_body_size 0;
            chunked_transfer_encoding on;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health endpoint
        location /health {
            return 200 'ForgeOps Nginx OK\n';
            add_header Content-Type text/plain;
        }
    }
}
