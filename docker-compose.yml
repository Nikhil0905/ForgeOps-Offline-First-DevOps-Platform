# ============================================================
# ForgeOps — Offline-First DevOps Platform
# Full stack: Gitea + Jenkins + Registry + Nexus + Dashboard
# ============================================================

networks:
  forgeops-net:
    driver: bridge

volumes:
  gitea-data:
  jenkins-data:
  registry-data:
  nexus-data:
  prometheus-data:
  grafana-data:
  dashboard-db:
  backup-data:

services:

  # ────────────────────────────────────────────────────────
  # REVERSE PROXY — Nginx
  # Routes: / → dashboard, /gitea → Gitea, /jenkins → Jenkins
  # ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: forgeops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - forgeops-net
    depends_on:
      - gitea
      - jenkins
      - dashboard-backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────
  # LOCAL GIT SERVER — Gitea
  # http://localhost/gitea (or :3000 direct)
  # ────────────────────────────────────────────────────────
  gitea:
    image: gitea/gitea:1.21
    container_name: forgeops-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=https://localhost/gitea/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__mailer__ENABLED=false
#    ports:
#      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
      - ./infrastructure/gitea/app.ini:/data/gitea/conf/app.ini
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - forgeops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ────────────────────────────────────────────────────────
  # CI/CD ENGINE — Jenkins
  # http://localhost/jenkins (or :8080 direct)
  # ────────────────────────────────────────────────────────
  jenkins:
    build:
      context: ./infrastructure/jenkins
      dockerfile: Dockerfile
    container_name: forgeops-jenkins
    user: root
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP=
      - JENKINS_OPTS=--prefix=/jenkins
      - JENKINS_URL=${JENKINS_URL}
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      - GITEA_URL=http://gitea:3000
      - REGISTRY_HOST=${REGISTRY_HOST}
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - ./infrastructure/jenkins/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forgeops-net
    depends_on:
      - gitea
      - registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ────────────────────────────────────────────────────────
  # LOCAL DOCKER REGISTRY
  # Push/pull: localhost:5000/<image>
  # ────────────────────────────────────────────────────────
  registry:
    image: registry:2
    container_name: forgeops-registry
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./infrastructure/registry/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - forgeops-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────
  # MAVEN DEPENDENCY MIRROR — Nexus Repository OSS
  # http://localhost:8081
  # ────────────────────────────────────────────────────────
  nexus:
    image: sonatype/nexus3:latest
    container_name: forgeops-nexus
    restart: unless-stopped
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - forgeops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s

  # ────────────────────────────────────────────────────────
  # MONITORING — Prometheus
  # http://localhost:9090
  # ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: forgeops-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - forgeops-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────
  # MONITORING — Grafana
  # http://localhost/grafana/
  # ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: forgeops-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - forgeops-net
    depends_on:
      - prometheus

  # ────────────────────────────────────────────────────────
  # DASHBOARD BACKEND — Flask API
  # http://localhost:5050
  # ────────────────────────────────────────────────────────
  dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: forgeops-dashboard-api
    restart: unless-stopped
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - DB_PATH=${DB_PATH}
      - JENKINS_URL=${JENKINS_URL}
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - GITEA_URL=http://gitea:3000
      - REGISTRY_URL=http://registry:5000
      - PROMETHEUS_URL=http://prometheus:9090
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - dashboard-db:/data
      - ./services/sync-engine/queue.json:/data/queue.json:ro
      - ./dashboard/backend/app.py:/app/app.py:ro
    networks:
      - forgeops-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/system-health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────
  # DASHBOARD FRONTEND — Nginx static server
  # http://localhost (served via main nginx proxy too)
  # ────────────────────────────────────────────────────────
  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: forgeops-dashboard-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./dashboard/frontend:/usr/share/nginx/html:ro
    networks:
      - forgeops-net
    depends_on:
      - dashboard-backend

  # ────────────────────────────────────────────────────────
  # SYNC ENGINE — Smart offline/online sync
  # ────────────────────────────────────────────────────────
  sync-engine:
    build:
      context: ./services/sync-engine
      dockerfile: Dockerfile
    container_name: forgeops-sync-engine
    restart: unless-stopped
    environment:
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS}
      - REMOTE_GIT_URL=${REMOTE_GIT_URL}
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD}
      - QUEUE_FILE=/data/queue.json
    volumes:
      - ./services/sync-engine/sync.py:/app/sync.py
      - ./services/sync-engine/queue.json:/data/queue.json
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - forgeops-net
    depends_on:
      - gitea

  # ────────────────────────────────────────────────────────
  # BACKUP ENGINE — Scheduled backups
  # ────────────────────────────────────────────────────────
  backup-engine:
    build:
      context: ./services/backup-engine
      dockerfile: Dockerfile
    container_name: forgeops-backup-engine
    restart: unless-stopped
    environment:
      - BACKUP_DIR=${BACKUP_DIR}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE}
    volumes:
      - backup-data:/backups
      - gitea-data:/source/gitea:ro
      - jenkins-data:/source/jenkins:ro
      - registry-data:/source/registry:ro
    networks:
      - forgeops-net

  # ────────────────────────────────────────────────────────
  # DEPLOYMENT ENGINE — Health-check + rollback deployer
  # ────────────────────────────────────────────────────────
  deployment-engine:
    build:
      context: ./services/deployment-engine
      dockerfile: Dockerfile
    container_name: forgeops-deployment-engine
    restart: unless-stopped
    environment:
      - REGISTRY_HOST=${REGISTRY_HOST}
      - DASHBOARD_API=http://dashboard-backend:5050
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forgeops-net
    depends_on:
      - registry
      - dashboard-backend

  # ────────────────────────────────────────────────────────
  # SECURITY SCANNER — Offline secrets + image scanner
  # ────────────────────────────────────────────────────────
  security-scanner:
    build:
      context: ./services/security-scanner
      dockerfile: Dockerfile
    container_name: forgeops-security-scanner
    restart: unless-stopped
    environment:
      - REGISTRY_HOST=${REGISTRY_HOST}
      - DASHBOARD_API=http://dashboard-backend:5050
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - registry-data:/registry:ro
      - ./services/security-scanner/scanner.py:/app/scanner.py:ro
    networks:
      - forgeops-net
    depends_on:
      - registry
      - dashboard-backend
